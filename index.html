<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2F6">
<title>Closet Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one phone-width column, sticky search, fixed bottom tab bar; items read like hang tags. */
:root{
  --bg:#F5F2F6; --surface:#FFFFFF; --tile:#ECE6EE; --ink:#231A29; --muted:#6F6476; --line:#E2DAE5;
  --accent:#B23A6B; --accent-ink:#FFFFFF; --accent-soft:#F7DDE8; --good:#2C7A4D; --good-soft:#DDF0E4;
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16111A; --surface:#211A26; --tile:#2C2431; --ink:#F2ECF4; --muted:#A99EAF; --line:#3A3140;
  --accent:#E46A9C; --accent-ink:#1A1018; --accent-soft:#4A2436; --good:#6CCB92; --good-soft:#1C3A28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16111A; --surface:#211A26; --tile:#2C2431; --ink:#F2ECF4; --muted:#A99EAF; --line:#3A3140;
  --accent:#E46A9C; --accent-ink:#1A1018; --accent-soft:#4A2436; --good:#6CCB92; --good-soft:#1C3A28; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.05}
h2{font-size:21px;font-weight:800;line-height:1.15}
h3{font-size:16px;font-weight:600}
p{margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* search */
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-top:-8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.search input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 18px;font-size:16px;outline:none}
.search input:focus{border-color:var(--accent)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:999px;padding:15px 18px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink);padding:13px 18px}
.btn-quiet{background:transparent;color:var(--muted);font-weight:500;font-size:14px;padding:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0}

/* check banner */
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:16px 18px;text-decoration:none;margin-block:8px 16px}
.banner b{font-family:var(--f-display);font-size:18px;display:block}
.banner span.arrow{font-size:22px;font-weight:700}
.note{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border-radius:18px;padding:8px;border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.thumb{aspect-ratio:4/5;width:100%;max-width:100%;border-radius:12px;background:var(--tile);object-fit:cover;display:block}
.card .name{font-weight:700;font-size:14px;line-height:1.25;padding-inline:4px;overflow-wrap:anywhere}
.card .meta{font-size:12px;color:var(--muted);padding-inline:4px 4px;padding-bottom:4px}
.never{color:var(--accent);font-weight:700}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:8px}

/* capture */
.drop{border:2px dashed var(--line);border-radius:24px;background:var(--surface);padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.drop .hint{max-width:28ch}
.drop .btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px}
.preview{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:20px;padding:10px}
.preview img{width:92px;height:115px;object-fit:cover;border-radius:12px;background:var(--tile);flex:none}
.field{display:flex;flex-direction:column;gap:8px}
.field > label, .field > .lbl{font-size:13px;font-weight:700}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.input:focus{border-color:var(--accent);outline:none}
.swatches{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.swatch{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;font-size:11px;color:var(--muted);width:52px}
.swatch i{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:block}
.swatch[aria-pressed="true"] i{outline:2.5px solid var(--accent);outline-offset:2px}
.swatch[aria-pressed="true"]{color:var(--ink);font-weight:700}
.detected{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:700}
.detected i{width:18px;height:18px;border-radius:50%;border:1px solid var(--line)}
.timer{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center}

/* matches */
.match{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:8px;border:0;width:100%;text-align:left;cursor:pointer}
.match img{width:52px;height:64px;border-radius:10px;object-fit:cover;background:var(--tile);flex:none}
.match .txt{flex:1;min-width:0}
.match .txt b{display:block;font-size:14px}
.pct{font-family:var(--f-mono);font-size:12px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:4px 9px;flex:none}
.verdict{border-radius:20px;padding:16px 18px}
.verdict.warn{background:var(--accent-soft)}
.verdict.ok{background:var(--good-soft)}
.verdict.ok h2{color:var(--good)}

/* celebration */
.done{text-align:center;padding:24px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .big{font-family:var(--f-display);font-size:48px;font-weight:800;line-height:1;color:var(--good)}

/* insights */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border-radius:16px;padding:12px}
.tile b{font-family:var(--f-display);font-size:24px;font-weight:800;display:block;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12px;color:var(--muted);line-height:1.3;display:block;margin-top:4px}
.panel{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:20px 72px 1fr 24px;gap:8px;align-items:center;font-size:13px}
.bar i{width:16px;height:16px;border-radius:50%;border:1px solid var(--line)}
.bar .track{height:10px;border-radius:5px;background:var(--tile);overflow:hidden}
.bar .fill{height:100%;background:var(--ink);border-radius:5px}
.bar .n{text-align:right;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.danger{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,8,18,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet .hero{width:100%;aspect-ratio:1/1;max-width:100%;object-fit:cover;border-radius:18px;background:var(--tile)}
.tag{position:relative;background:var(--surface);border-radius:14px 14px 14px 14px;padding:16px 16px 14px 34px}
.tag::before{content:"";position:absolute;left:12px;top:20px;width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.tag .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;border-top:1.5px dashed var(--line);padding-top:12px}
.tag .facts div{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tag .facts b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink);text-transform:none;letter-spacing:0}
.confirm{background:var(--accent-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 9px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--accent);font-weight:700}
.nav a.add .plus{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin-top:-6px}
.nav a.add .plus svg{width:20px;height:20px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}.toast{animation:fade .2s ease-out}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="app"><main id="view" aria-live="polite"></main></div>

<nav class="nav" aria-label="Main">
  <div class="nav-in">
    <a href="#wardrobe" data-tab="wardrobe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a2 2 0 1 1 2 2c-1 0-2 .6-2 1.6V9l8.5 6.2a1.6 1.6 0 0 1-1 2.8H4.5a1.6 1.6 0 0 1-1-2.8L12 9"/></svg>Wardrobe</a>
    <a href="#check" data-tab="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/><path d="m9.5 13.5 2 2 3.5-3.5"/></svg>Check</a>
    <a href="#add" data-tab="add" class="add"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Add</a>
    <a href="#insights" data-tab="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Insights</a>
  </div>
</nav>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" hidden>

<script>
/* ---------- reference data ---------- */
const TYPES=['Top','Dress','Jeans','Trousers','Skirt','Kurta','Saree','Jacket','Shoes','Bag','Other'];
const RELATED={Top:['Kurta','Jacket'],Kurta:['Top','Dress'],Dress:['Kurta','Skirt'],Jeans:['Trousers'],Trousers:['Jeans','Skirt'],Skirt:['Dress','Trousers'],Jacket:['Top'],Saree:['Kurta']};
const OCCASIONS=['Casual','Work','Party','Festive','Gym'];
const COLOURS=[
 ['Black',[28,28,30]],['White',[242,241,236]],['Grey',[140,140,142]],['Beige',[214,196,168]],['Brown',[120,80,52]],
 ['Red',[192,40,48]],['Maroon',[112,26,42]],['Pink',[236,158,180]],['Orange',[234,128,52]],['Yellow',[238,204,70]],
 ['Green',[56,138,80]],['Olive',[110,114,60]],['Teal',[28,128,128]],['Light blue',[150,190,226]],['Blue',[62,100,170]],
 ['Navy',[30,40,82]],['Purple',[118,68,150]],['Lavender',[190,170,222]]
];
const rgbOf=n=>(COLOURS.find(c=>c[0]===n)||COLOURS[0])[1];
const hex=c=>'#'+c.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const DAY=864e5;

/* ---------- colour maths ---------- */
function lab([r,g,b]){
  const f=c=>{c/=255;return c>0.04045?Math.pow((c+0.055)/1.055,2.4):c/12.92};
  const R=f(r),G=f(g),B=f(b);
  let x=(R*.4124+G*.3576+B*.1805)/.95047,y=R*.2126+G*.7152+B*.0722,z=(R*.0193+G*.1192+B*.9505)/1.08883;
  const h=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;
  x=h(x);y=h(y);z=h(z);
  return [116*y-16,500*(x-y),200*(y-z)];
}
function dE(a,b){const A=lab(a),B=lab(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2])}
function nearestColour(rgb){let best='Black',bd=1e9;for(const [n,c] of COLOURS){const d=dE(rgb,c);if(d<bd){bd=d;best=n}}return best}
/* Dominant garment colour: ignore pixels that look like the photo's background (estimated from the border). */
function dominant(img){
  const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;
  const x=cv.getContext('2d');x.drawImage(img,0,0,s,s);
  const d=x.getImageData(0,0,s,s).data;
  let bg=[0,0,0],bn=0;
  for(let i=0;i<s;i++)for(const [px,py] of [[i,0],[i,s-1],[0,i],[s-1,i]]){const k=(py*s+px)*4;bg[0]+=d[k];bg[1]+=d[k+1];bg[2]+=d[k+2];bn++}
  bg=bg.map(v=>v/bn);
  const buckets=new Map();let all=[0,0,0],an=0;
  for(let y=4;y<s-4;y++)for(let xx=4;xx<s-4;xx++){
    const k=(y*s+xx)*4;if(d[k+3]<128)continue;
    const p=[d[k],d[k+1],d[k+2]];all[0]+=p[0];all[1]+=p[1];all[2]+=p[2];an++;
    if(dE(p,bg)<14)continue;
    const key=(p[0]>>5)<<6|(p[1]>>5)<<3|(p[2]>>5);
    let b=buckets.get(key);if(!b){b=[0,0,0,0];buckets.set(key,b)}
    b[0]+=p[0];b[1]+=p[1];b[2]+=p[2];b[3]++;
  }
  let top=null;for(const b of buckets.values())if(!top||b[3]>top[3])top=b;
  if(!top||top[3]<20)return all.map(v=>Math.round(v/Math.max(an,1)));
  return [top[0]/top[3],top[1]/top[3],top[2]/top[3]].map(Math.round);
}
/* Similarity score 0-98: colour closeness (55%) + garment type (45%). */
function similarity(a,b){
  const t=a.type===b.type?1:(RELATED[a.type]||[]).includes(b.type)?0.6:0.15;
  const c=Math.max(0,1-dE(a.rgb,b.rgb)/55);
  return Math.min(98,Math.round(100*(0.55*c+0.45*t)*(c>0.2?1:0.5)));
}

/* ---------- storage (IndexedDB on this device, memory fallback) ---------- */
const DB={db:null,
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('closet-check',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},
  async get(k){if(!this.db)return null;try{return await new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}},
  async set(k,v){if(!this.db)return;try{await new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
};
let S={items:[],skips:[],seeded:false};
const save=()=>DB.set('state',S);

/* ---------- example wardrobe ---------- */
const SHAPES={
  Dress:'<path d="M40 14h20l3 22 18 72H19l18-72z"/><path d="M40 14l-2-8M60 14l2-8" stroke="SHADE" stroke-width="2" fill="none"/>',
  Top:'<path d="M32 20l13-6q5 8 10 0l13 6 16 20-12 8-4-6v58H32V42l-4 6-12-8z"/>',
  Jacket:'<path d="M32 20l13-6 5 30 5-30 13 6 16 20-12 8-4-6v62H32V42l-4 6-12-8z"/><path d="M50 44v60" stroke="SHADE" stroke-width="2"/>',
  Jeans:'<path d="M30 12h40l6 98H56l-6-64-6 64H24z"/>',
  Kurta:'<path d="M32 16l13-5q5 8 10 0l13 5 14 22-10 6-4-6v74H32V38l-4 6-10-6z"/><path d="M50 18v20" stroke="SHADE" stroke-width="2"/>'
};
function garmentSVG(type,c){
  const shade=hex(c.map(v=>v*0.7));
  const body=(SHAPES[type]||SHAPES.Top).split('SHADE').join(shade);
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 125"><rect width="100" height="125" fill="#ECE6EE"/><g fill="${hex(c)}" stroke="${shade}" stroke-width="1.5" stroke-linejoin="round">${body}</g></svg>`);
}
function seedExamples(){
  const now=Date.now();
  const mk=(name,type,colour,occasion,price,wears,lastAgo,addedAgo)=>{
    const rgb=rgbOf(colour);const worn=[];
    for(let i=0;i<wears;i++)worn.push(now-(lastAgo+i*9)*DAY);
    return {id:'ex'+Math.random().toString(36).slice(2,8),name,type,colour,rgb,occasion,price,img:garmentSVG(type,rgb),added:now-addedAgo*DAY,worn:worn.reverse(),example:true};
  };
  S.items=[
    mk('Black slip dress','Dress','Black','Party',2499,3,40,200),
    mk('Black midi dress','Dress','Black','Work',1899,7,5,180),
    mk('Black bodycon dress','Dress','Black','Party',1599,0,0,120),
    mk('Pink satin top','Top','Pink','Party',1299,4,10,90),
    mk('Blue jeans','Jeans','Blue','Casual',2199,15,2,300),
    mk('Beige blazer','Jacket','Beige','Work',3499,2,71,160),
    mk('Green kurta','Kurta','Green','Festive',1499,1,94,140),
    mk('White shirt','Top','White','Work',999,9,6,220)
  ];
  S.skips=[{ts:now-3*DAY,price:2199,name:'Black wrap dress',example:true}];
  S.seeded=true;
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupee=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const fmtDate=ts=>new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const lastWorn=it=>it.worn.length?it.worn[it.worn.length-1]:null;
const daysSince=ts=>Math.floor((Date.now()-ts)/DAY);
const wornToday=it=>{const l=lastWorn(it);return l&&new Date(l).toDateString()===new Date().toDateString()};
const hasExamples=()=>S.items.some(i=>i.example)||S.skips.some(s=>s.example);
function wearLine(it){
  if(!it.worn.length)return '<span class="never">Never worn</span>';
  return `Worn ${it.worn.length}× · ${fmtDate(lastWorn(it))}`;
}
let toastTimer;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;
  document.body.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2600);
}
function readImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{
      const max=520,sc=Math.min(1,max/Math.max(im.width,im.height));
      const cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      const rgb=dominant(cv);
      res({img:cv.toDataURL('image/jpeg',0.8),rgb});
    };im.onerror=rej;im.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

/* ---------- state for flows ---------- */
let filter='All',query='';
let addDraft=null;     // {img,rgb,colour,type,name,nameTouched,occasion,price,t0}
let checkDraft=null;   // {img,rgb,colour,type,price,done}
let captureTarget='add';

/* ---------- views ---------- */
function viewWardrobe(){
  const types=['All',...TYPES.filter(t=>S.items.some(i=>i.type===t))];
  if(!types.includes(filter))filter='All';
  return `
  <header class="top"><div><p class="eyebrow">My wardrobe</p><h1>${S.items.length} piece${S.items.length===1?'':'s'}</h1></div></header>
  <div class="search"><input id="q" type="search" placeholder="Search: black dress, work tops…" value="${esc(query)}" aria-label="Search your wardrobe" autocomplete="off"></div>
  <div class="chips" role="group" aria-label="Filter by type">${types.map(t=>`<button class="chip" data-act="filter" data-v="${t}" aria-pressed="${t===filter}">${t}</button>`).join('')}</div>
  <a class="banner" href="#check"><div><b>Out shopping?</b><span class="small">Snap it and see what you already own</span></div><span class="arrow" aria-hidden="true">→</span></a>
  ${hasExamples()?`<div class="note"><span>These are example pieces so you can try the app. Your own photos stay on this device.</span><button class="linkbtn" data-act="clearExamples">Clear</button></div>`:''}
  <p id="count" class="small muted" style="margin-bottom:8px"></p>
  <div id="grid"></div>`;
}
function matchesQuery(it){
  const hay=`${it.name} ${it.type} ${it.colour} ${it.occasion||''}`.toLowerCase();
  return query.toLowerCase().split(/\s+/).filter(Boolean).every(w=>{
    const stem=w.replace(/(es|s)$/,'');return hay.includes(w)||hay.includes(stem);
  });
}
function renderGrid(){
  const g=$('#grid');if(!g)return;
  if(!S.items.length){
    g.innerHTML=`<div class="empty"><h2>Your wardrobe is empty</h2><p>Add a piece each time you buy or wear something. It takes one photo.</p><p style="margin-top:16px"><a class="btn btn-primary" href="#add">Add your first piece</a></p></div>`;
    $('#count').textContent='';return;
  }
  const list=S.items.filter(i=>(filter==='All'||i.type===filter)&&matchesQuery(i)).sort((a,b)=>b.added-a.added);
  $('#count').textContent=query||filter!=='All'?`${list.length} match${list.length===1?'':'es'}`:'';
  g.className=list.length?'grid':'';
  g.innerHTML=list.length?list.map(it=>`
    <button class="card" data-act="open" data-id="${it.id}">
      <img class="thumb" src="${it.img}" alt="">
      <span class="name">${esc(it.name)}</span>
      <span class="meta">${wearLine(it)}</span>
    </button>`).join(''):`<div class="empty"><h2>Nothing matches “${esc(query)}”</h2><p>Try a colour or a type, like “blue” or “kurta”.</p></div>`;
}

function captureBlock(title,hint,which){
  return `<div class="drop">
    <h2>${title}</h2><p class="hint muted">${hint}</p>
    <div class="btns">
      <label class="btn btn-primary" for="camIn" data-act="setTarget" data-v="${which}">Take a photo</label>
      <label class="btn btn-ghost" for="galIn" data-act="setTarget" data-v="${which}">Choose from gallery</label>
    </div></div>`;
}
function colourPicker(selected,act){
  return `<div class="swatches" role="group" aria-label="Colour">${COLOURS.map(([n,c])=>`<button class="swatch" data-act="${act}" data-v="${n}" aria-pressed="${n===selected}"><i style="background:${hex(c)}"></i>${n}</button>`).join('')}</div>`;
}
function typePicker(selected,act){
  return `<div class="wrapchips" role="group" aria-label="Type">${TYPES.map(t=>`<button class="chip" data-act="${act}" data-v="${t}" aria-pressed="${t===selected}">${t}</button>`).join('')}</div>`;
}

function viewAdd(){
  if(!addDraft)return `<header class="top"><div><p class="eyebrow">Add a piece</p><h1>One photo, done</h1></div></header>
    ${captureBlock('Lay it flat or hold it up','We pick the colour for you. You just tap what it is.','add')}`;
  const d=addDraft;
  return `<header class="top"><div><p class="eyebrow">Add a piece</p><h1>Check the tags</h1></div><button class="linkbtn" data-act="addReset">Retake</button></header>
  <div class="stack">
    <div class="preview"><img src="${d.img}" alt="Your photo"><div class="stack" style="gap:8px">
      <span class="detected"><i style="background:${hex(d.rgb)}"></i>Looks ${esc(d.colour.toLowerCase())}</span>
      <p class="small muted">Wrong colour? Pick the right one below.</p></div></div>
    <div class="field"><span class="lbl">Colour</span>${colourPicker(d.colour,'addColour')}</div>
    <div class="field"><span class="lbl">What is it?</span>${typePicker(d.type,'addType')}</div>
    <div class="field"><label for="addName">Name</label><input class="input" id="addName" value="${esc(d.name)}" placeholder="e.g. Black slip dress"></div>
    <div class="field"><span class="lbl">Occasion <span class="muted" style="font-weight:400">(optional)</span></span>
      <div class="wrapchips">${OCCASIONS.map(o=>`<button class="chip" data-act="addOcc" data-v="${o}" aria-pressed="${o===d.occasion}">${o}</button>`).join('')}</div></div>
    <div class="field"><label for="addPrice">Price paid <span class="muted" style="font-weight:400">(optional, for cost per wear)</span></label><input class="input" id="addPrice" inputmode="numeric" value="${d.price||''}" placeholder="₹"></div>
    <button class="btn btn-primary" data-act="addSave" ${d.type?'':'disabled'}>${d.type?'Save to wardrobe':'Tap what it is to save'}</button>
    <p class="timer" id="addTimer"></p>
  </div>`;
}

function viewCheck(){
  if(!checkDraft)return `<header class="top"><div><p class="eyebrow">Check before buying</p><h1>Do I already own this?</h1></div></header>
    ${captureBlock('Snap the item you are about to buy','Works in a shop, or with a screenshot from Myntra, Ajio or Instagram.','check')}`;
  const d=checkDraft;
  if(d.done)return viewSaved(d);
  const scored=d.type?S.items.map(it=>({it,s:similarity(d,it)})).filter(x=>x.s>=70).sort((a,b)=>b.s-a.s).slice(0,6):[];
  let results='';
  if(!d.type)results=`<p class="muted small">Tap what it is to see matches from your wardrobe.</p>`;
  else if(scored.length)results=`
    <div class="verdict warn"><p class="eyebrow">Hold on</p><h2>You already own ${scored.length} similar piece${scored.length===1?'':'s'}</h2></div>
    <div class="stack" style="gap:8px">${scored.map(({it,s})=>`
      <button class="match" data-act="open" data-id="${it.id}"><img src="${it.img}" alt=""><span class="txt"><b>${esc(it.name)}</b><span class="small muted">${wearLine(it)}</span></span><span class="pct">${s}% match</span></button>`).join('')}</div>
    <button class="btn btn-primary" data-act="skip">Skip it, I am good</button>
    <button class="btn btn-ghost" data-act="buyAnyway">Buy anyway and add to wardrobe</button>`;
  else results=`
    <div class="verdict ok"><p class="eyebrow">All clear</p><h2>Nothing like this in your wardrobe</h2><p class="small" style="margin-top:4px">It fills a real gap. Go ahead.</p></div>
    <button class="btn btn-primary" data-act="buyAnyway">I bought it, add to wardrobe</button>`;
  return `<header class="top"><div><p class="eyebrow">Check before buying</p><h1>Here is what you own</h1></div><button class="linkbtn" data-act="checkReset">Scan again</button></header>
  <div class="stack">
    <div class="preview"><img src="${d.img}" alt="Item you scanned"><div class="stack" style="gap:8px">
      <p class="small muted">You scanned</p>
      <span class="detected"><i style="background:${hex(d.rgb)}"></i>${esc(d.colour)}${d.type?' '+esc(d.type.toLowerCase()):''}</span></div></div>
    <div class="field"><span class="lbl">What is it?</span>${typePicker(d.type,'checkType')}</div>
    <details><summary class="small muted" style="cursor:pointer">Colour looks wrong? Change it</summary>${colourPicker(d.colour,'checkColour')}</details>
    <div class="field"><label for="checkPrice">Price <span class="muted" style="font-weight:400">(optional, to track savings)</span></label><input class="input" id="checkPrice" inputmode="numeric" value="${d.price||''}" placeholder="₹"></div>
    ${results}
  </div>`;
}
function viewSaved(d){
  const month=new Date().getMonth();
  const mine=S.skips.filter(s=>new Date(s.ts).getMonth()===month);
  const total=mine.reduce((a,s)=>a+(s.price||0),0);
  const pool=S.items.filter(it=>similarity(d,it)>=70).sort((a,b)=>a.worn.length-b.worn.length);
  const tip=pool[0];
  return `<div class="done">
    <p class="eyebrow">Duplicate skipped</p>
    <p class="big">${d.price?rupee(d.price):'Nice call'}</p>
    <h2>${d.price?'saved':'One less duplicate'}</h2>
    ${tip?`<p class="muted" style="max-width:32ch">Wear your ${esc(tip.name.toLowerCase())} this weekend instead. ${tip.worn.length?`You've worn it ${tip.worn.length}×.`:'You have never worn it.'}</p>`:''}
    <div class="panel" style="width:100%;text-align:left"><p class="eyebrow">This month</p><h3>${mine.length} duplicate${mine.length===1?'':'s'} skipped${total?' · '+rupee(total)+' saved':''}</h3></div>
    <button class="btn btn-primary" data-act="checkReset">Check another item</button>
    <a class="btn btn-quiet" href="#wardrobe">Back to my wardrobe</a>
  </div>`;
}

function viewInsights(){
  const n=S.items.length;
  const recent=S.items.filter(i=>{const l=lastWorn(i);return l&&daysSince(l)<=30}).length;
  const pct=n?Math.round(100*recent/n):0;
  const month=new Date().getMonth();
  const skipsM=S.skips.filter(s=>new Date(s.ts).getMonth()===month);
  const saved=skipsM.reduce((a,s)=>a+(s.price||0),0);
  const counts={};S.items.forEach(i=>counts[i.colour]=(counts[i.colour]||0)+1);
  const colours=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const maxC=colours.length?colours[0][1]:1;
  const forgotten=S.items.filter(i=>{const l=lastWorn(i);return l?daysSince(l)>=60:daysSince(i.added)>=30})
    .map(i=>({i,d:lastWorn(i)?daysSince(lastWorn(i)):null})).sort((a,b)=>(b.d??1e9)-(a.d??1e9));
  const most=[...S.items].filter(i=>i.worn.length).sort((a,b)=>b.worn.length-a.worn.length).slice(0,3);
  if(!n)return `<header class="top"><div><p class="eyebrow">Insights</p><h1>Nothing to show yet</h1></div></header><div class="empty"><p>Add a few pieces and log what you wear. Your patterns show up here.</p><p style="margin-top:16px"><a class="btn btn-primary" href="#add">Add a piece</a></p></div>`;
  return `<header class="top"><div><p class="eyebrow">Insights</p><h1>How you really dress</h1></div></header>
  <div class="stack">
    <div class="tiles">
      <div class="tile"><b>${pct}%</b><span>of your wardrobe worn in 30 days</span></div>
      <div class="tile"><b>${saved?rupee(saved):'₹0'}</b><span>saved by skipping this month</span></div>
      <div class="tile"><b>${skipsM.length}</b><span>duplicate${skipsM.length===1?'':'s'} skipped this month</span></div>
    </div>
    <section class="panel"><div><h3>Forgotten gems</h3><p class="small muted">Not worn in 60+ days. Give them a turn.</p></div>
      ${forgotten.length?`<div class="stack" style="gap:8px">${forgotten.map(({i,d})=>`<button class="match" data-act="open" data-id="${i.id}" style="background:var(--bg)"><img src="${i.img}" alt=""><span class="txt"><b>${esc(i.name)}</b><span class="small muted">${esc(i.type)} · ${esc(i.colour)}</span></span><span class="small ${d===null?'never':'muted'}">${d===null?'Never worn':d+' days'}</span></button>`).join('')}</div>`:`<p class="small muted">Everything has been worn recently. Nice.</p>`}
    </section>
    <section class="panel"><div><h3>Your colour mix</h3><p class="small muted">Lots of one colour is where duplicates hide.</p></div>
      ${colours.map(([c,k])=>`<div class="bar"><i style="background:${hex(rgbOf(c))}"></i><span>${c}</span><span class="track"><span class="fill" style="width:${Math.round(100*k/maxC)}%;display:block"></span></span><span class="n">${k}</span></div>`).join('')}
    </section>
    ${most.length?`<section class="panel"><h3>Most worn</h3>${most.map(i=>`<div class="row" style="justify-content:space-between"><span>${esc(i.name)}</span><span class="small muted" style="font-family:var(--f-mono)">${i.worn.length}×${i.price?' · '+rupee(i.price/i.worn.length)+'/wear':''}</span></div>`).join('')}</section>`:''}
    <section class="panel" id="dataPanel"><h3>Your data</h3><p class="small muted">Photos and wear logs are saved in this browser on this device only.</p>
      <div id="dataActions" class="stack" style="gap:8px">
        ${hasExamples()?`<button class="btn btn-ghost" data-act="clearExamples">Clear example pieces</button>`:''}
        <button class="btn btn-quiet danger" data-act="askReset">Delete everything</button>
      </div></section>
  </div>`;
}

/* ---------- item sheet ---------- */
let sheetId=null,sheetMode=null;
function openSheet(id){sheetId=id;sheetMode=null;renderSheet()}
function closeSheet(){sheetId=null;const s=$('.scrim');if(s)s.remove()}
function renderSheet(){
  let s=$('.scrim');
  const it=S.items.find(i=>i.id===sheetId);
  if(!it){if(s)s.remove();return}
  if(!s){s=document.createElement('div');s.className='scrim';s.addEventListener('click',e=>{if(e.target===s)closeSheet()});document.body.appendChild(s)}
  const cpw=it.price&&it.worn.length?rupee(it.price/it.worn.length):it.price?rupee(it.price):'–';
  const similar=sheetMode==='similar'?S.items.filter(o=>o.id!==it.id).map(o=>({o,s:similarity(it,o)})).filter(x=>x.s>=60).sort((a,b)=>b.s-a.s):null;
  s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(it.name)}">
    <div class="grab"></div>
    <div class="row" style="justify-content:space-between"><span class="eyebrow">${it.example?'Example piece':'In your wardrobe'}</span><button class="linkbtn" data-act="close">Close</button></div>
    <img class="hero" src="${it.img}" alt="${esc(it.name)}">
    <div class="tag">
      <h2>${esc(it.name)}</h2>
      <div class="wrapchips" style="margin-top:8px"><span class="chip">${esc(it.type)}</span><span class="chip">${esc(it.colour)}</span>${it.occasion?`<span class="chip">${esc(it.occasion)}</span>`:''}</div>
      <div class="facts">
        <div>Worn<b>${it.worn.length}×</b></div>
        <div>Last worn<b>${lastWorn(it)?fmtDate(lastWorn(it)):'Never'}</b></div>
        <div>Per wear<b>${cpw}</b></div>
      </div>
    </div>
    <button class="btn btn-primary" data-act="wear" ${wornToday(it)?'disabled':''}>${wornToday(it)?'Logged for today':'I wore this today'}</button>
    <button class="btn btn-ghost" data-act="similar">Find similar in my wardrobe</button>
    ${similar?(similar.length?`<div class="stack" style="gap:8px">${similar.map(({o,s})=>`<button class="match" data-act="open" data-id="${o.id}"><img src="${o.img}" alt=""><span class="txt"><b>${esc(o.name)}</b><span class="small muted">${wearLine(o)}</span></span><span class="pct">${s}%</span></button>`).join('')}</div>`:`<p class="small muted">Nothing similar. This one is unique in your wardrobe.</p>`):''}
    ${sheetMode==='remove'?`<div class="confirm"><b>Remove ${esc(it.name)}?</b><p class="small">This deletes the photo and its wear history.</p><div class="row"><button class="btn btn-primary" data-act="removeYes">Remove</button><button class="btn btn-ghost" data-act="removeNo">Keep it</button></div></div>`:`<button class="btn btn-quiet" data-act="removeAsk">Remove from wardrobe</button>`}
  </div>`;
}

/* ---------- router ---------- */
const ROUTES={wardrobe:viewWardrobe,check:viewCheck,add:viewAdd,insights:viewInsights};
let addTick;
function route(){
  const r=ROUTES[location.hash.slice(1)]?location.hash.slice(1):'wardrobe';
  $('#view').innerHTML=ROUTES[r]();
  document.querySelectorAll('.nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===r?'page':'false'));
  if(r==='wardrobe')renderGrid();
  clearInterval(addTick);
  if(r==='add'&&addDraft){const t=()=>{const el=$('#addTimer');if(el)el.textContent=`${Math.round((Date.now()-addDraft.t0)/1000)}s since photo`};t();addTick=setInterval(t,1000)}
}
function rerender(){const y=scrollY;route();scrollTo(0,y)}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  if(a==='setTarget'){captureTarget=v;return}
  if(a==='filter'){filter=v;document.querySelectorAll('[data-act="filter"]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===v));renderGrid();return}
  if(a==='open'){openSheet(el.dataset.id);return}
  if(a==='close'){closeSheet();return}
  if(a==='clearExamples'){S.items=S.items.filter(i=>!i.example);S.skips=S.skips.filter(s=>!s.example);await save();toast('Examples cleared. Your wardrobe is ready for real pieces.');rerender();return}
  if(a==='askReset'){$('#dataActions').innerHTML=`<div class="confirm"><b>Delete every piece and log?</b><p class="small">This cannot be undone.</p><div class="row"><button class="btn btn-primary" data-act="resetYes">Delete all</button><button class="btn btn-ghost" data-act="resetNo">Cancel</button></div></div>`;return}
  if(a==='resetNo'){rerender();return}
  if(a==='resetYes'){S.items=[];S.skips=[];await save();toast('Everything deleted');location.hash='#wardrobe';rerender();return}
  // add flow
  if(a==='addColour'){addDraft.colour=v;addDraft.rgb=rgbOf(v);autoName();rerender();return}
  if(a==='addType'){addDraft.type=v;autoName();rerender();return}
  if(a==='addOcc'){addDraft.occasion=addDraft.occasion===v?'':v;rerender();return}
  if(a==='addReset'){addDraft=null;rerender();return}
  if(a==='addSave'){
    const d=addDraft;if(!d||!d.type)return;
    const secs=Math.round((Date.now()-d.t0)/1000);
    S.items.push({id:'i'+Date.now().toString(36),name:(d.name||'').trim()||`${d.colour} ${d.type.toLowerCase()}`,type:d.type,colour:d.colour,rgb:d.rgb,occasion:d.occasion||'',price:Number(d.price)||0,img:d.img,added:Date.now(),worn:[]});
    await save();addDraft=null;filter='All';query='';
    toast(`Added in ${secs} seconds`);location.hash='#wardrobe';return;
  }
  // check flow
  if(a==='checkType'){checkDraft.type=v;rerender();return}
  if(a==='checkColour'){checkDraft.colour=v;checkDraft.rgb=rgbOf(v);rerender();const det=document.querySelector('details');if(det)det.open=true;return}
  if(a==='checkReset'){checkDraft=null;location.hash='#check';rerender();return}
  if(a==='skip'){S.skips.push({ts:Date.now(),price:Number(checkDraft.price)||0,name:`${checkDraft.colour} ${checkDraft.type}`});await save();checkDraft.done=true;rerender();scrollTo(0,0);return}
  if(a==='buyAnyway'){const d=checkDraft;addDraft={img:d.img,rgb:d.rgb,colour:d.colour,type:d.type,name:'',nameTouched:false,occasion:'',price:d.price||'',t0:Date.now()};autoName();checkDraft=null;location.hash='#add';return}
  // sheet
  const it=S.items.find(i=>i.id===sheetId);
  if(a==='wear'&&it){it.worn.push(Date.now());await save();toast(`Logged: ${it.name}`);renderSheet();if(location.hash!=='#check')rerender();return}
  if(a==='similar'){sheetMode=sheetMode==='similar'?null:'similar';renderSheet();return}
  if(a==='removeAsk'){sheetMode='remove';renderSheet();return}
  if(a==='removeNo'){sheetMode=null;renderSheet();return}
  if(a==='removeYes'&&it){S.items=S.items.filter(i=>i.id!==it.id);await save();closeSheet();toast('Removed');rerender();return}
});
function autoName(){if(addDraft&&!addDraft.nameTouched)addDraft.name=addDraft.type?`${addDraft.colour} ${addDraft.type.toLowerCase()}`:''}
document.addEventListener('input',e=>{
  if(e.target.id==='q'){query=e.target.value;renderGrid()}
  if(e.target.id==='addName'&&addDraft){addDraft.name=e.target.value;addDraft.nameTouched=true}
  if(e.target.id==='addPrice'&&addDraft)addDraft.price=e.target.value.replace(/\D/g,'');
  if(e.target.id==='checkPrice'&&checkDraft)checkDraft.price=e.target.value.replace(/\D/g,'');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetId)closeSheet()});
for(const id of ['camIn','galIn'])$('#'+id).addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{
    const {img,rgb}=await readImage(f);const colour=nearestColour(rgb);
    if(captureTarget==='check'){checkDraft={img,rgb:rgbOf(colour),colour,type:'',price:''};location.hash='#check'}
    else{addDraft={img,rgb:rgbOf(colour),colour,type:'',name:'',nameTouched:false,occasion:'',price:'',t0:Date.now()};location.hash='#add'}
    rerender();
  }catch(err){toast('That photo could not be read. Try a JPG or PNG.')}
});
window.addEventListener('hashchange',()=>{closeSheet();route();scrollTo(0,0)});

/* ---------- boot ---------- */
(async()=>{
  seedExamples(); // instant first frame, replaced by saved data if any
  route();
  await DB.open();
  const saved=await DB.get('state');
  if(saved&&saved.seeded){S=saved}else{await save()}
  route();
})();
</script>
